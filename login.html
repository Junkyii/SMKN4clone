<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Portal Akses Sistem - SMKN 4 Bandung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <div class="login-box">
    
    <div class="login-header">
      <a href="index.html">
        <img src="src/logo4.png" alt="Logo SMKN 4 Bandung" />
      </a>
      <h2>Welcome Back</h2>
      <p>Masukkan username dan password untuk melanjutkan</p>
    </div>

    <div class="alert-message" id="alertMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="formLoginJS">
      
      <div class="form-group user-group">
        <input type="text" id="usernameInput" placeholder="Username" />
        <span class="error-msg" id="errorUser"></span>
      </div>

      <div class="form-group pass-group">
        <div class="password-wrapper">
          <input type="password" id="passwordInput" placeholder="Password" />
          <span class="password-toggle" id="togglePassword">Show</span>
        </div>
        <span class="error-msg" id="errorPass"></span>
      </div>

      <button type="submit" class="btn-submit">Login</button>

    </form>

    <a href="index.html" class="back-link">← Kembali ke Beranda</a>

  </div>

  <script src="script.js"></script>

</body>
</html>
